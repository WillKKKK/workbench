<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>康哥工作台 — 状态总控台 v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #e8f0f8;
    --bg-card: #ffffff;
    --bg-card-hover: #f0f6ff;
    --border: #d0dce8;
    --text: #2c3e50;
    --text-bright: #0f1a2e;
    --text-dim: #7a8a9a;
    --blue: #2563eb;
    --blue-glow: rgba(37,99,235,0.15);
    --gold: #d97706;
    --green: #059669;
    --red: #dc2626;
    --radius: 14px;
    --radius-sm: 10px;
  }
  body {
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }

  /* ===== HEADER ===== */
  .header {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 16px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    box-shadow: 0 2px 8px rgba(15,26,46,0.04);
  }
  .header-title { font-size: 24px; font-weight: 900; color: var(--text-bright); letter-spacing: 1px; }
  .header-title .kk { color: var(--blue); }
  .header-sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .date-badge {
    background: var(--blue-glow); color: var(--blue);
    padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 14px;
  }
  .refresh-badge {
    background: #f0f4f9; color: var(--text-dim);
    padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
  }

  /* ===== 总览条 ===== */
  .overview {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;
    margin-bottom: 16px;
  }
  .ov-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: all .15s ease;
  }
  .ov-card:hover { border-color: var(--blue); box-shadow: 0 3px 12px var(--blue-glow); transform: translateY(-2px); }
  .ov-dot { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .ov-dot.ok { background: rgba(5,150,105,0.12); }
  .ov-dot.warn { background: rgba(217,119,6,0.12); }
  .ov-dot.miss { background: rgba(220,38,38,0.10); }
  .ov-dot.svc { background: rgba(124,58,237,0.12); }
  .ov-name { font-size: 13px; color: var(--text-dim); font-weight: 600; }
  .ov-val { font-size: 15px; font-weight: 800; color: var(--text-bright); margin-top: 2px; }
  .ov-status { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* ===== 区块标题 ===== */
  .section-title {
    font-size: 15px; font-weight: 800; color: var(--text-bright);
    margin: 22px 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .section-title .bar { width: 4px; height: 16px; background: var(--blue); border-radius: 2px; }

  /* ===== Codex 状态卡 ===== */
  .codex-bar {
    background: linear-gradient(180deg, #f5f3ff 0%, #ffffff 100%);
    border: 1px solid #ddd6fe; border-radius: var(--radius);
    padding: 14px 18px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .codex-left { display: flex; align-items: center; gap: 12px; }
  .codex-avatar {
    width: 44px; height: 44px; border-radius: 12px; background: rgba(124,58,237,0.12);
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  .codex-name { font-size: 15px; font-weight: 800; color: var(--text-bright); }
  .codex-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .codex-task {
    font-size: 12px; color: var(--text-bright); background: #fff; border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 8px; font-weight: 600;
  }
  .pill.sleep { background: rgba(124,58,237,0.10); color: #7c3aed; }
  .pill.awake { background: rgba(5,150,105,0.12); color: var(--green); }

  /* ===== 项目卡片 ===== */
  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 16px; }
  @media (max-width: 540px) { .projects { grid-template-columns: 1fr; } }

  .project {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(15,26,46,0.04);
    transition: box-shadow .2s;
  }
  .project:hover { box-shadow: 0 6px 20px rgba(15,26,46,0.08); }
  .project-head {
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .project-head.red { background: linear-gradient(180deg, #fef2f2 0%, #ffffff 100%); }
  .project-head.blue { background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%); }
  .project-name { font-size: 18px; font-weight: 900; color: var(--text-bright); }
  .project-path { font-size: 11px; color: var(--text-dim); margin-top: 2px; font-family: Consolas, monospace; }
  .pill { font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; }
  .pill.ok { background: rgba(5,150,105,0.12); color: var(--green); }
  .pill.warn { background: rgba(217,119,6,0.12); color: var(--gold); }
  .pill.miss { background: rgba(220,38,38,0.10); color: var(--red); }

  .project-body { padding: 16px 20px 20px; }

  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    background: #f7fafd; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; transition: all .15s;
  }
  .stat:hover { background: var(--bg-card-hover); border-color: var(--blue); }
  .stat-label { font-size: 11px; color: var(--text-dim); font-weight: 600; }
  .stat-val { font-size: 16px; font-weight: 800; color: var(--text-bright); margin-top: 3px; }
  .stat-note { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .btn-row { display: flex; flex-direction: column; gap: 10px; }
  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn-group-label {
    font-size: 11px; color: var(--text-dim); font-weight: 700; letter-spacing: 1px;
    margin-right: 4px; flex-shrink: 0;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 10px;
    background: var(--bg-card); border: 1.5px solid var(--border);
    color: var(--text-bright); font-size: 13px; font-weight: 600;
    cursor: pointer; text-decoration: none; white-space: nowrap;
    transition: all .15s ease;
  }
  .btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-glow); transform: translateY(-1px); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.primary:hover { background: #1d4ed8; color: #fff; }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
  .btn.gold:hover { background: #b45309; color: #fff; }
  .btn.purple { background: #7c3aed; border-color: #7c3aed; color: #fff; }
  .btn.purple:hover { background: #6d28d9; color: #fff; }

  /* ===== 服务区 ===== */
  .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .service {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; display: flex; align-items: center; gap: 14px;
    text-decoration: none; color: inherit;
    transition: all .15s ease;
    box-shadow: 0 2px 8px rgba(15,26,46,0.04);
  }
  .service:hover { border-color: #7c3aed; box-shadow: 0 4px 16px rgba(124,58,237,0.15); transform: translateY(-2px); }
  .service-icon {
    width: 48px; height: 48px; border-radius: 12px; background: rgba(124,58,237,0.12);
    display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
  }
  .service-name { font-size: 15px; font-weight: 800; color: var(--text-bright); }
  .service-sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; font-family: Consolas, monospace; }
  .service-note { font-size: 11px; color: var(--gold); margin-top: 3px; font-weight: 600; }

  /* ===== 快捷指令 ===== */
  .cmds {
    margin-top: 16px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 20px;
    box-shadow: 0 2px 8px rgba(15,26,46,0.04);
  }
  .cmds-title { font-size: 13px; font-weight: 800; color: var(--text-bright); margin-bottom: 10px; }
  .cmd-chip {
    display: inline-block; background: #f0f4f9; border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 12px; font-size: 12px; font-family: Consolas, monospace;
    color: var(--text-bright); margin: 0 6px 6px 0; cursor: pointer;
    transition: all .15s;
  }
  .cmd-chip:hover { background: var(--blue-glow); border-color: var(--blue); }
  .cmd-chip.copied { background: rgba(5,150,105,0.12); border-color: var(--green); }

  .foot { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="header-title">🖥️ 康哥<span class="kk">工作台</span> <span style="font-size:13px;font-weight:600;color:var(--text-dim);">状态总控台</span></div>
      <div class="header-sub">一页看全所有项目 · 点击直达 · 状态每日自动更新</div>
    </div>
    <div class="header-right">
      <span class="refresh-badge" id="refreshBadge">⏱ 数据更新中…</span>
      <span class="date-badge" id="dateBadge"></span>
    </div>
  </div>

  <!-- 总览 -->
  <div class="overview" id="overview"></div>

  <!-- Codex 状态 -->
  <div class="codex-bar" id="codexBar"></div>

  <!-- 项目 -->
  <div class="section-title"><span class="bar"></span>📚 知识库项目</div>
  <div class="projects" id="projects"></div>

  <!-- 服务 -->
  <div class="section-title" id="servicesTitle"><span class="bar"></span>🔌 本地服务</div>
  <div class="services" id="services"></div>

  <!-- 快速指令 -->
  <div class="section-title"><span class="bar"></span>⚡ 快捷指令</div>
  <div class="cmds">
    <div class="cmds-title">点一下复制，粘贴到 Hermes 对话即执行，不用打字</div>
    <div id="cmdChips"></div>
  </div>

  <div class="foot">Hermes 工作台 · 状态由 update_workbench.py 每日自动刷新 · <span id="footGen"></span></div>
</div>

<!-- 实时状态（由 update_workbench.py 生成） -->
<script src="state.js"></script>
<script>
const PAD = n => String(n).padStart(2, '0');
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${PAD(d.getMonth()+1)}-${PAD(d.getDate())}`;
}

// 兜底默认
const DEFAULT_STATE = {
  qiepian: {
    name: '切片知识库', emoji: '✂️', color: 'red',
    path: 'D:\\Hermes\\Obsidian\\切片知识库',
    status: 'warn', statusText: '状态待刷新',
    stats: [ {label:'最新日榜',val:'—',note:''}, {label:'最新稿件',val:'—',note:''}, {label:'产出文件',val:'—',note:''}, {label:'全库笔记',val:'—',note:''} ],
    feishu: 'https://fzyjxswl.feishu.cn/wiki/ND2BwvWP5iZcF7k3fjBc6ixEnMg?sheet=6988bf',
    feishu_name: '媒体工作表（同事共用）',
    feishu_personal: 'https://fzyjxswl.feishu.cn/wiki/J89EwDepoiIZ7yku9G2cIzM3n9c',
    feishu_personal_name: '切片个人文章',
    commands: ['切到切片知识库项目', '跑切片pipeline', '更新今日贴图'],
  },
  ai: {
    name: 'AI公众号', emoji: '🤖', color: 'blue',
    path: 'D:\\Hermes\\Obsidian\\AI公众号知识库',
    status: 'warn', statusText: '状态待刷新',
    stats: [ {label:'最新日榜',val:'—',note:''}, {label:'选题数',val:'—',note:''}, {label:'待审稿件',val:'—',note:''}, {label:'定位文档',val:'—',note:''} ],
    feishu: null,
    feishu_personal: 'https://fzyjxswl.feishu.cn/wiki/YtibwNDkiiRcoXk7nfmcC3b3nye',
    feishu_personal_name: 'AI公众号个人文章',
    commands: ['切到AI公众号项目', '跑AI赛道采集', '写第一篇稿'],
  },
  services: [ {id:'ai_service', name:'本地AI服务', sub:'192.168.1.239:4174', emoji:'🧠', url:'http://192.168.1.239:4174/', note:'需个人访问链接'} ],
  generated_at: '',
};

let STATE = DEFAULT_STATE;
try {
  if (typeof WINDOW_STATE !== 'undefined' && WINDOW_STATE && Object.keys(WINDOW_STATE).length) {
    STATE = WINDOW_STATE;
  }
} catch (e) {}

document.getElementById('dateBadge').textContent = '📅 ' + today();
if (STATE.generated_at) {
  document.getElementById('refreshBadge').textContent = '⏱ 更新于 ' + STATE.generated_at;
  document.getElementById('footGen').textContent = '上次生成 ' + STATE.generated_at;
}

function statusEmoji(s) { return s === 'ok' ? '✅' : (s === 'warn' ? '⚠️' : '⛔'); }
function statusDotClass(s) { return s === 'ok' ? 'ok' : (s === 'warn' ? 'warn' : 'miss'); }
function statusPillText(s) { return s === 'ok' ? '运行中' : (s === 'warn' ? '待更新' : '异常'); }

function renderOverview() {
  const ov = document.getElementById('overview');
  ov.innerHTML = '';
  for (const key of ['qiepian', 'ai']) {
    const p = STATE[key];
    if (!p) continue;
    ov.innerHTML += `
      <div class="ov-card" onclick="openObsidian('${p.path.replace(/\\/g, '\\\\')}')">
        <div class="ov-dot ${statusDotClass(p.status)}">${statusEmoji(p.status)}</div>
        <div>
          <div class="ov-name">${p.emoji} ${p.name}</div>
          <div class="ov-val">${p.statusText}</div>
          <div class="ov-status">${p.path}</div>
        </div>
      </div>`;
  }
  // 注意：服务不渲染在总览条，只在下方"服务区"展示（避免与renderServices重复）
}

function renderProjects() {
  const container = document.getElementById('projects');
  container.innerHTML = '';
  for (const key of ['qiepian', 'ai']) {
    const p = STATE[key];
    if (!p) continue;
    const statsHtml = (p.stats || []).map(s => `
      <div class="stat">
        <div class="stat-label">${s.label}</div>
        <div class="stat-val">${s.val}</div>
        <div class="stat-note">${s.note}</div>
      </div>`).join('');

    // 操作行：打开知识库（Obsidian）+ 进入项目组（Hermes切换指令）
    let btns = `
      <div class="btn-group">
        <span class="btn-group-label">⚡ 操作</span>
        <a class="btn primary" href="obsidian://open?path=${encodeURIComponent(p.path)}">📂 打开知识库</a>
        <button class="btn" onclick="copyCmd('${p.commands[0]}', this)">🚀 进入项目组</button>
      </div>`;
    let docBtns = '';
    if (p.feishu) docBtns += `<a class="btn gold" href="${p.feishu}" target="_blank">📋 ${p.feishu_name || '飞书核心文档'}</a>`;
    if (p.feishu_personal) docBtns += `<a class="btn purple" href="${p.feishu_personal}" target="_blank">👤 ${p.feishu_personal_name || '个人文档'}</a>`;
    if (docBtns) btns += `<div class="btn-group"><span class="btn-group-label">📄 文档</span>${docBtns}</div>`;

    container.innerHTML += `
      <div class="project">
        <div class="project-head ${p.color}">
          <div>
            <div class="project-name">${p.emoji} ${p.name}</div>
            <div class="project-path">${p.path}</div>
          </div>
          <span class="pill ${statusDotClass(p.status)}">${statusPillText(p.status)}</span>
        </div>
        <div class="project-body">
          <div class="stat-grid">${statsHtml}</div>
          <div class="btn-row">${btns}</div>
        </div>
      </div>`;
  }
}

function renderServices() {
  const el = document.getElementById('services');
  el.innerHTML = '';
  const svcs = STATE.services || [];
  if (!svcs.length) {
    // 无服务时整体隐藏区块（包括标题）
    const title = document.getElementById('servicesTitle');
    if (title) title.style.display = 'none';
    el.style.display = 'none';
    return;
  }
  svcs.forEach(s => {
    el.innerHTML += `
      <a class="service" href="${s.url}" target="_blank">
        <div class="service-icon">${s.emoji || '🧠'}</div>
        <div>
          <div class="service-name">${s.name}</div>
          <div class="service-sub">${s.sub}</div>
          <div class="service-note">${s.note || ''}</div>
        </div>
      </a>`;
  });
}

function renderCodex() {
  const el = document.getElementById('codexBar');
  const cx = STATE.codex || { available: false, note: '未知', task: '—', task_status: '—' };
  const awake = !!cx.available;
  el.innerHTML = `
    <div class="codex-left">
      <div class="codex-avatar">🤖</div>
      <div>
        <div class="codex-name">Codex 老弟 ${awake ? '💪 值班中' : '😴 休息中'}</div>
        <div class="codex-sub">${cx.note || ''}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span class="pill ${awake ? 'awake' : 'sleep'}">${awake ? '可接任务' : '额度不足'}</span>
      <span class="codex-task">📝 待办：${cx.task || '—'} · ${cx.task_status || ''}</span>
      <button class="btn" onclick="copyCmd('准备下一项 Codex 任务', this)">📋 交接包指令</button>
    </div>`;
}

function renderCmds() {
  const el = document.getElementById('cmdChips');
  const cmds = new Set();
  cmds.add('今天有什么要处理的？');
  cmds.add('写公众号贴图');
  cmds.add('写朋友圈');
  cmds.add('准备下一项 Codex 任务');
  el.innerHTML = '';
  cmds.forEach(c => {
    const chip = document.createElement('span');
    chip.className = 'cmd-chip';
    chip.dataset.cmd = c;
    chip.textContent = c;
    chip.addEventListener('click', () => copyCmd(c, chip));
    el.appendChild(chip);
  });
}

function openObsidian(path) {
  window.open('obsidian://open?path=' + encodeURIComponent(path), '_blank');
}

function copyCmd(text, el) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  el.classList.add('copied');
  const old = el.textContent;
  el.textContent = '✅ 已复制';
  setTimeout(() => { el.textContent = old; el.classList.remove('copied'); }, 1500);
}

renderOverview();
renderCodex();
renderProjects();
renderServices();
renderCmds();
</script>
</body>
</html>
